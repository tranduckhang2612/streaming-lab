apiVersion: 1
datasources:
  - name: PostgreSQL
    uid: postgres-streaming
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: ${POSTGRES_PASSWORD}